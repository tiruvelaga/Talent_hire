{% extends 'exam/base.html' %}
{% block title %}Error – TalentHire{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card mx-auto" style="max-width: 500px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1);">
        <div class="card-body p-5">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 3rem;"></i>
            <h4 class="mt-3 fw-bold">Oops! Something went wrong</h4>
            <p class="text-muted mt-2">{{ message }}</p>
            <a href="{% url 'login' %}" class="btn btn-primary mt-3">
                <i class="bi bi-arrow-left me-2"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
