{% extends 'exam/admin_base.html' %}
{% block title %}{{ action }} Candidate – Admin Portal{% endblock %}
{% block nav_cand %}active{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">
            <div class="admin-card">
                <div class="admin-card-header">
                    <span>
                        {% if action == 'Add' %}
                            <i class="bi bi-person-plus me-2"></i>Add New Candidate
                        {% else %}
                            <i class="bi bi-pencil me-2"></i>Edit Candidate
                        {% endif %}
                    </span>
                </div>
                <div class="p-4">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person me-1"></i> Full Name</label>
                            <input type="text" name="name" class="form-control"
                                   value="{{ candidate.name|default:'' }}"
                                   placeholder="e.g. Arjun Reddy" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-phone me-1"></i> Mobile Number</label>
                            <input type="text" name="mobile" class="form-control"
                                   value="{{ candidate.mobile|default:'' }}"
                                   placeholder="e.g. 9876543210" maxlength="15" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label"><i class="bi bi-hash me-1"></i> Registration ID</label>
                            <input type="text" name="registration_id" class="form-control"
                                   value="{{ candidate.registration_id|default:'' }}"
                                   placeholder="e.g. TH-2024-001" required>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn-orange" style="padding:11px 26px;">
                                <i class="bi bi-check-circle me-1"></i>
                                {% if action == 'Add' %}Add Candidate{% else %}Save Changes{% endif %}
                            </button>
                            <a href="{% url 'admin_candidates' %}" style="padding:11px 20px; border-radius:10px; border:2px solid #e5e7eb; color:#6b7280; font-weight:600; font-size:0.88rem; text-decoration:none;">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
